<html lang="ko">

<title>라그나로크 카츄아 뽑기 시뮬레이터 & 실전 기록기</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f5f7;color:#202124;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans KR",sans-serif}
.wrap{max-width:1300px;margin:15px auto;padding:12px}
.card{background:#fff;border:1px solid #e2e5e9;border-radius:12px;padding:16px;box-shadow:0 4px 14px rgba(0,0,0,.04);margin-bottom:12px}
h1{margin:0 0 10px;font-size:20px}
h2{margin:0 0 8px;font-size:16px}

textarea{width:100%;min-height:90px;padding:10px;border:1px solid #cfd4da;border-radius:8px;font:12px/1.4 ui-monospace,SFMono-Regular,Consolas,monospace;resize:vertical}
button{padding:7px 12px;border:0;border-radius:6px;background:#222;color:#fff;font-size:12px;font-weight:700;cursor:pointer;transition:all 0.2s}
button:hover{opacity:0.9}
.btnrow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.secondary{background:#eef0f2;color:#222}
.primary-blue{background:#0066ff;color:#fff}
.primary-green{background:#087f3f;color:#fff}
.danger{background:#ff4d4f;color:#fff}

/* 요약 헤더 */
.header-summary{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-top:10px;padding-bottom:8px;border-bottom:2px solid #edf0f2}
.total-val-box{background:#f8fafc;padding:6px 12px;border-radius:8px;border:1px solid #e2e8f0;text-align:right}
.total-val-main{font-size:15px;font-weight:800;color:#087f3f}
.total-val-sub{font-size:11px;color:#64748b;margin-top:2px}

/* 5분할 그리드 (최대 높이 변경: 기존 55vh의 약 4배 수준인 220vh 또는 충분한 높이 확보) */
.grid-container{display:grid;grid-template-columns:repeat(5, 1fr);gap:6px;margin-top:10px;max-height:220vh;overflow-y:auto;padding-right:2px}

/* 밀집형 카드 (시뮬레이터용) */
.item-card{border:1px solid #e5e7eb;border-radius:6px;padding:6px 8px;background:#fff;display:flex;flex-direction:column;justify-content:space-between;min-height:62px}

/* 희귀도 색상 */
.rate-ur{background:#fff5f5;border-color:#ffc9c9}
.rate-ur .item-name{color:#d91e1e;font-weight:bold}
.rate-ur .badge{background:#d91e1e;color:#fff}

.rate-r{background:#fffdf0;border-color:#fef08a}
.rate-r .item-name{color:#b7791f;font-weight:bold}
.rate-r .badge{background:#d69e2e;color:#fff}

.rate-uc{background:#f0f7ff;border-color:#bae0ff}
.rate-uc .item-name{color:#0958d9}
.rate-uc .badge{background:#1677ff;color:#fff}

.rate-c{background:#fafafa;border-color:#e8e8e8}
.rate-c .item-name{color:#434343}
.rate-c .badge{background:#8c8c8c;color:#fff}

.item-top{display:flex;justify-content:space-between;align-items:flex-start;gap:4px}
.item-name{font-size:11px;line-height:1.2;word-break:keep-all}
.badge{font-size:9px;padding:1px 4px;border-radius:3px;white-space:nowrap;font-weight:bold}
.item-bottom{margin-top:4px;display:flex;justify-content:space-between;align-items:flex-end}
.item-price-info{font-size:10px;color:#6b7280;line-height:1.1}
.item-qty{font-size:12px;font-weight:800;color:#111827}

/* 실제 뽑기 목록 스타일 */
.search-input{padding:6px 10px;border:1px solid #cfd4da;border-radius:6px;font-size:12px;width:200px}
.real-list-container{display:grid;grid-template-columns:repeat(3, 1fr);gap:6px;margin-top:10px;max-height:400px;overflow-y:auto;padding-right:2px}
.real-item-row{border:1px solid #e5e7eb;border-radius:6px;padding:6px 8px;background:#fff;display:flex;align-items:center;justify-content:space-between;gap:6px}
.real-item-info{display:flex;flex-direction:column;flex:1;min-width:0}
.real-item-name{font-size:11px;font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.real-item-price{font-size:10px;color:#6b7280}

.qty-control{display:flex;align-items:center;gap:3px;flex-shrink:0}
.btn-qty{width:22px;height:22px;padding:0;font-size:12px;line-height:1;border-radius:4px;background:#eef0f2;color:#222;display:inline-flex;align-items:center;justify-content:center}
.btn-qty:hover{background:#0066ff;color:#fff}
.input-qty{width:36px;height:22px;text-align:center;font-size:11px;border:1px solid #cfd4da;border-radius:4px;padding:0}

@media(max-width:1100px){
  .grid-container{grid-template-columns:repeat(4, 1fr);}
  .real-list-container{grid-template-columns:repeat(2, 1fr);}
}
@media(max-width:850px){
  .grid-container{grid-template-columns:repeat(3, 1fr);}
  .real-list-container{grid-template-columns:repeat(1, 1fr);}
}
@media(max-width:600px){
  .grid-container{grid-template-columns:repeat(2, 1fr);}
}
</style>
</head>

    </div>

  </div>

  <div class="card">

    </div>

</div>

const fmt = n => n == null ? "-" : Number(n).toLocaleString("ko-KR");

let simResults = new Map();  // 시뮬레이터: 이름 -> 수량
let realResults = new Map(); // 실제 입력: 이름 -> 수량
let priceMap = new Map();    // 이름 -> 단가
let totalSimCount = 0;

let totalWeight = 0;
const cumulativeList = DEFAULT_LIST.map(item => {
  totalWeight += item.rate;
  return { ...item, cumRate: totalWeight };
});

function getRateClass(rate) {
  if (rate < 0.1) return "rate-ur";
  if (rate < 0.5) return "rate-r";
  if (rate < 3.0) return "rate-uc";
  return "rate-c";
}

// ---------------- 1. 시뮬레이터 로직 ----------------
function drawOne() {
  const rand = Math.random() * totalWeight;
  const found = cumulativeList.find(it => rand <= it.cumRate) || cumulativeList[cumulativeList.length - 1];
  const currentQty = simResults.get(found.name) || 0;
  simResults.set(found.name, currentQty + found.qty);
  totalSimCount++;
}

function simulate(count) {
  for(let i=0; i<count; i++) drawOne();
  $("totalSimCount").textContent = fmt(totalSimCount);
  calculateAndRender();
  saveCache();
}

// ---------------- 2. 시세 파싱 ----------------
function parsePriceText(text) {
  priceMap.clear();

  // 기본 목록에 price 값이 포함되어 있다면 초기화 값으로 세팅
  DEFAULT_LIST.forEach(item => {
    if(item.price !== null && item.price !== undefined) {
      priceMap.set(item.name, item.price);
    }
  });

  if(!text) return;
  const lines = text.split(/\r?\n/).map(x => x.trim()).filter(Boolean);

  lines.forEach(line => {
    let cells = line.split(/\t|\|/).map(x => x.trim()).filter(Boolean);
    if(cells.length < 2) return;

    const name = cells[0].replace(/<[^>]*>/g, "").trim();
    const lastCell = cells[cells.length - 1];
    const priceMatch = lastCell.replace(/,/g, "").match(/(\d+)\s*(?:Zeny|Z)?/i);

    if(name && priceMatch) {
      const price = Number(priceMatch[1]);
      if(!isNaN(price)) priceMap.set(name, price);
    }
  });
}

// 기본 목록 텍스트 영역에 자동 채우기
function loadDefaultListText() {
  const textLines = DEFAULT_LIST.map(item => {
    const priceVal = item.price != null ? item.price : 0;
    return `${item.name}\t${priceVal}`;
  });
  $("priceInput").value = textLines.join("\n");
  calculateAndRender();
  saveCache();
}

// ---------------- 3. 렌더링 및 계산 ----------------
function renderSimGrid() {
  const container = $("gridContainer");
  container.innerHTML = "";

  if(simResults.size === 0) {
    container.innerHTML = `<div style="grid-column: 1 / -1; text-align:center; padding:30px; color:#8c8c8c; font-size:13px;">뽑기 버튼을 누르면 목록이 표시됩니다.</div>`;
    return;
  }

  let sorted = [...simResults.entries()].sort((a,b) => {
    const rateA = (DEFAULT_LIST.find(i => i.name === a[0]) || {}).rate || 0;
    const rateB = (DEFAULT_LIST.find(i => i.name === b[0]) || {}).rate || 0;
    return rateA - rateB;
  });

  sorted.forEach(([name, qty]) => {
    const itemData = DEFAULT_LIST.find(i => i.name === name) || { rate: 0 };
    const rateClass = getRateClass(itemData.rate);
    const unitPrice = priceMap.get(name);
    const sumPrice = unitPrice != null ? unitPrice * qty : null;

    const card = document.createElement("div");
    card.className = `item-card ${rateClass}`;
    
    let priceTextHtml = unitPrice != null 
      ? `${fmt(unitPrice)} Z<br><b style="color:#087f3f;">${fmt(sumPrice)} Z</b>` 
      : `<span style="color:#b0b0b0;">-</span>`;

    card.innerHTML = `
      <div class="item-top">
        <span class="item-name">${escapeHtml(name)}</span>
        <span class="badge">${itemData.rate}%</span>
      </div>
      <div class="item-bottom">
        <div class="item-price-info">${priceTextHtml}</div>
        <div class="item-qty">${fmt(qty)}개</div>
      </div>
    `;
    container.appendChild(card);
  });
}

function renderRealList() {
  const container = $("realListContainer");
  const keyword = $("realSearch").value.trim().toLowerCase();
  container.innerHTML = "";

  // 확률 낮은 순 정렬
  const sortedList = [...DEFAULT_LIST].sort((a,b) => a.rate - b.rate);

  sortedList.forEach(item => {
    if (keyword && !item.name.toLowerCase().includes(keyword)) return;

    const qty = realResults.get(item.name) || 0;
    const unitPrice = priceMap.get(item.name);
    const sumPrice = unitPrice != null ? unitPrice * qty : null;

    let priceHtml = unitPrice != null 
      ? `${fmt(unitPrice)} Z ${qty > 0 ? `| <b style="color:#087f3f;">${fmt(sumPrice)} Z</b>` : ''}` 
      : `시세 미입력`;

    const row = document.createElement("div");
    row.className = "real-item-row";
    row.innerHTML = `
      <div class="real-item-info">
        <div class="real-item-name" title="${escapeHtml(item.name)}">${escapeHtml(item.name)} <span style="font-weight:normal; font-size:10px; color:#888;">(${item.rate}%)</span></div>
        <div class="real-item-price">${priceHtml}</div>
      </div>
      <div class="qty-control">
        <button class="btn-qty" onclick="changeRealQty('${escapeHtml(item.name)}', -1)">-</button>
        <input type="number" class="input-qty" value="${qty}" min="0" onchange="setRealQty('${escapeHtml(item.name)}', this.value)">
        <button class="btn-qty" onclick="changeRealQty('${escapeHtml(item.name)}', 1)">+</button>
      </div>
    `;
    container.appendChild(row);
  });
}

function changeRealQty(name, delta) {
  const current = realResults.get(name) || 0;
  const next = Math.max(0, current + delta);
  if (next === 0) realResults.delete(name);
  else realResults.set(name, next);
  calculateAndRender();
  saveCache();
}

function setRealQty(name, val) {
  const num = Math.max(0, parseInt(val, 10) || 0);
  if (num === 0) realResults.delete(name);
  else realResults.set(name, num);
  calculateAndRender();
  saveCache();
}

function calculateAndRender() {
  const priceText = $("priceInput").value.trim();
  parsePriceText(priceText);

  // 1회당 기대값 계산
  let singleExpectedValue = 0;
  DEFAULT_LIST.forEach(item => {
    const unitPrice = priceMap.get(item.name);
    if(unitPrice != null) {
      singleExpectedValue += (item.rate / 100) * item.qty * unitPrice;
    }
  });

  // A. 시뮬레이터 합계 & 기대값
  let simTotalVal = 0;
  simResults.forEach((qty, name) => {
    const unitPrice = priceMap.get(name);
    if(unitPrice != null) simTotalVal += unitPrice * qty;
  });
  $("totalPulledValue").textContent = fmt(simTotalVal) + " Zeny";

  const simTotalExpVal = Math.round(singleExpectedValue * totalSimCount);
  const simDiff = simTotalVal - simTotalExpVal;
  if (totalSimCount > 0 && singleExpectedValue > 0) {
    const diffFmt = (simDiff >= 0 ? "+" : "") + fmt(simDiff);
    const color = simDiff >= 0 ? "#087f3f" : "#d91e1e";
    $("expectedValCompare").innerHTML = `기대값: ${fmt(simTotalExpVal)} Z (1회 당 ${fmt(Math.round(singleExpectedValue))} Z) <span style="color:${color}; font-weight:bold;">[${diffFmt} Z]</span>`;
  } else {
    $("expectedValCompare").innerHTML = `기대값: - Z (1회 당 ${singleExpectedValue > 0 ? fmt(Math.round(singleExpectedValue)) : "-"} Z)`;
  }

  // B. 실제 입력 합계 & 기대값
  let realTotalVal = 0;
  let realTotalQty = 0;
  realResults.forEach((qty, name) => {
    realTotalQty += qty;
    const unitPrice = priceMap.get(name);
    if(unitPrice != null) realTotalVal += unitPrice * qty;
  });

  $("realTotalCount").textContent = fmt(realTotalQty);
  $("realTotalValue").textContent = fmt(realTotalVal) + " Zeny";

  const realTotalExpVal = Math.round(singleExpectedValue * realTotalQty);
  const realDiff = realTotalVal - realTotalExpVal;
  if (realTotalQty > 0 && singleExpectedValue > 0) {
    const diffFmt = (realDiff >= 0 ? "+" : "") + fmt(realDiff);
    const color = realDiff >= 0 ? "#087f3f" : "#d91e1e";
    $("realExpectedCompare").innerHTML = `기대값: ${fmt(realTotalExpVal)} Z <span style="color:${color}; font-weight:bold;">[${diffFmt} Z]</span>`;
  } else {
    $("realExpectedCompare").innerHTML = `기대값: - Z`;
  }

  renderSimGrid();
  renderRealList();
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function saveCache() {
  localStorage.setItem("kachyua_sim_results", JSON.stringify([...simResults.entries()]));
  localStorage.setItem("kachyua_real_results", JSON.stringify([...realResults.entries()]));
  localStorage.setItem("kachyua_sim_count", totalSimCount.toString());
  localStorage.setItem("kachyua_price_text", $("priceInput").value);
}

function loadCache() {
  try {
    const savedSim = localStorage.getItem("kachyua_sim_results");
    const savedReal = localStorage.getItem("kachyua_real_results");
    const savedCount = localStorage.getItem("kachyua_sim_count");
    const savedText = localStorage.getItem("kachyua_price_text");

    if (savedText != null) $("priceInput").value = savedText;
    if (savedSim != null) simResults = new Map(JSON.parse(savedSim));
    if (savedReal != null) realResults = new Map(JSON.parse(savedReal));
    if (savedCount != null) {
      totalSimCount = Number(savedCount) || 0;
      $("totalSimCount").textContent = fmt(totalSimCount);
    }
  } catch (e) {
    console.error("캐시 로드 실패:", e);
  }
}

// 이벤트 리스너
$("sim1").addEventListener("click", () => simulate(1));
$("sim10").addEventListener("click", () => simulate(10));
$("sim50").addEventListener("click", () => simulate(50));
$("sim100").addEventListener("click", () => simulate(100));
$("sim1000").addEventListener("click", () => simulate(1000));

$("resetSim").addEventListener("click", () => {
  simResults.clear();
  totalSimCount = 0;
  $("totalSimCount").textContent = "0";
  calculateAndRender();
  saveCache();
});

$("resetRealBtn").addEventListener("click", () => {
  if(confirm("실제 입력 수량을 모두 초기화하시겠습니까?")) {
    realResults.clear();
    calculateAndRender();
    saveCache();
  }
});

$("realSearch").addEventListener("input", renderRealList);

$("calcValBtn").addEventListener("click", () => {
  calculateAndRender();
  saveCache();
});

$("loadDefaultBtn").addEventListener("click", loadDefaultListText);

$("priceInput").addEventListener("input", () => {
  calculateAndRender();
  saveCache();
});

$("clearCacheBtn").addEventListener("click", () => {
  if (confirm("저장된 모든 캐시 데이터를 전체 삭제하시겠습니까?")) {
    localStorage.clear();
    simResults.clear();
    realResults.clear();
    priceMap.clear();
    totalSimCount = 0;
    $("priceInput").value = "";
    $("totalSimCount").textContent = "0";
    calculateAndRender();
  }
});

window.addEventListener("DOMContentLoaded", () => {
  loadCache();
  calculateAndRender();
});
</script>
</body>
</html>
