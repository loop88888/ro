<meta charset="UTF-8">

<style>

body{
    background:#111;
    color:#ddd;
    font-family:sans-serif;
    margin:0;
    padding:12px;
    font-size:14px;
}

h1{
    margin:0 0 10px 0;
    color:#ffd700;
    font-size:24px;
}

.controls{
    margin-bottom:10px;
}

button{
    background:#333;
    color:white;
    border:none;
    border-radius:4px;
    padding:6px 10px;
    margin:2px;
    cursor:pointer;
    font-size:13px;
}

button:hover{
    background:#555;
}

.stats{
    margin-bottom:10px;
    color:#999;
}

#log{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:2px 12px;
    line-height:1.1;
}

.item{
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.count{
    color:#888;
    font-size:12px;
}

/* 0.01% 이하 */
.ultra{
    color:#ff3355;
    font-weight:bold;
    text-shadow:
        0 0 6px #ff3355,
        0 0 12px #ff3355;
}

/* 0.1% 미만 */
.legend{
    color:#ffd700;
    font-weight:bold;
    text-shadow:
        0 0 4px #ffd700;
}

/* 1% 미만 */
.rare{
    color:#66bbff;
}

.common{
    color:#ddd;
}
@media(max-width:1000px){
    #log{
        grid-template-columns:repeat(3,1fr);
    }
}

@media(max-width:700px){
    #log{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:500px){
    #log{
        grid-template-columns:repeat(1,1fr);
    }
}

</style>
</head>

const totalRate =
items.reduce((a,b)=>a+b.rate,0);

const inventory = {};

let totalDraw = 0;

function getRandomItem(){

    let rand = Math.random() * totalRate;

    let sum = 0;

    for(const item of items){

        sum += item.rate;

        if(rand <= sum){
            return item;
        }
    }

    return items[0];
}

function getClass(rate){

    if(rate <= 0.01) return "ultra";
    if(rate < 0.1) return "legend";
    if(rate < 1) return "rare";

    return "common";
}

function draw(times){

    for(let i=0;i<times;i++){

        const item = getRandomItem();

        totalDraw++;

        if(!inventory[item.name]){

            inventory[item.name] = {
                count:0,
                rate:item.rate
            };
        }

        inventory[item.name].count++;
    }

    render();
}

function render(){

    const log = document.getElementById("log");

    log.innerHTML = "";

    const sorted =
    Object.entries(inventory)
    .sort((a,b)=>{

        if(a[1].rate === b[1].rate){
            return b[1].count - a[1].count;
        }

        return a[1].rate - b[1].rate;
    });

    for(const [name,data] of sorted){

        const div = document.createElement("div");

        div.className =
        `item ${getClass(data.rate)}`;

        div.innerHTML =
        `${name} <span class="count">x${data.count}</span>`;

        log.appendChild(div);
    }

    document.getElementById("totalDraw").textContent =
    totalDraw.toLocaleString();
}

function resetAll(){

    totalDraw = 0;

    for(const key in inventory){
        delete inventory[key];
    }

    render();
}
